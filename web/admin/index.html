est/v1/rpc/'+name,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(args)})},async edge(name,data){return request('/functions/v1/'+name,{method:'POST',headers:data instanceof FormData?{}:{'Content-Type':'application/json'},body:data instanceof FormData?data:JSON.stringify(data)})}}})();

function variantForm(v,i){return `<div class="variant-row" data-index="${i}" data-id="${v.id||''}" data-expected="${v.stock||0}"><div class="grid2"><div><label>اسم الخيار / اللون</label><input data-field="name_ar" value="${esc(v.name_ar)}"></div><div><label>رمز المنتج</label><input data-field="sku" value="${esc(v.sku||'')}"></div><div><label>المخزون</label><input data-field="stock" type="number" min="0" value="${v.stock||0}"></div><div><label>سعر خاص — اختياري</label><input data-field="price_override" type="number" min="0" value="${v.price_override??''}"></div><div><label>حد تنبيه النقص</label><input data-field="low_stock_limit" type="number" min="0" value="${v.low_stock_limit??3}"></div><label class="gap"><input data-field="active" type="checkbox" style="width:auto" ${v.active!==false?'checked':''}> متاح</label></div></div>`}
function addVariant(){const el=document.createElement('div');el.innerHTML=variantForm({name_ar:'',stock:0,active:true},document.querySelectorAll('.variant-row').length);$('variantRows').append(...el.children)}
async function saveProduct(button){await busy(button,async()=>{const files=[...$('pFiles').files];if(files.some(f=>f.size>CFG.maxFile))throw new Error('FILE_TOO_LARGE');const variants=[...document.querySelectorAll('.variant-row')].map(row=>{const v={id:row.dataset.id||null};row.querySelectorAll('[data-field]').forEach(e=>v[e.dataset.field]=e.type==='checkbox'?e.checked:e.value);if(v.id)v.expected_stock=Number(row.dataset.expected);return v});if(!$('pName').value.trim()||$('pPrice').value===''||variants.some(v=>!v.name_ar.trim()||Number(v.stock)<0))return toast('أكمل اسم المنتج والسعر والخيارات');const published=$('pPublish').checked;const data={id:productEdit.id||null,name_ar:$('pName').value.trim(),name_en:$('pNameEn').value.trim(),base_price:Number($('pPrice').value),compare_at_price:$('pOldPrice').value||null,brand:$('pBrand').value.trim(),category_id:$('pCategory').value,gender:$('pGender').value,style:$('pStyle').value,description_ar:$('pDesc').value.trim(),featured:$('pFeatured').checked};
if(productEdit.id&&productEdit.published&&files.length)await API.edge('admin-actions',{action:'publish',id:productEdit.id,published:false});const id=await API.rpc('save_product',{p_data:data,p_variants:variants});productEdit.id=id;
try{$('uploadProgress').classList.remove('hidden');for(let i=0;i<files.length;i++){$('uploadProgress').textContent=`رفع ${i+1} من ${files.length}: ${files[i].name}`;const fd=new FormData();fd.append('file',files[i]);fd.append('product_id',id);await API.edge('telegram-upload',fd)}
await API.edge('admin-actions',{action:'publish',id,published});$('uploadProgress').textContent='اكتمل الحفظ';await loadAdminProducts();closeModal();dashboard();toast(published?'تم حفظ ونشر المنتج':'تم حفظ المسودة')}catch(e){await loadAdminProducts();editProduct(id);toast('انحفظ المنتج والملفات الناجحة. أعد اختيار الملفات التي لم تُرفع.');throw e}})}
async function publishProduct(id,published,button){await busy(button,async()=>{await API.edge('admin-actions',{action:'publish',id,published});await loadAdminProducts();dashboard();toast(published?'تم النشر':'تم الإخفاء')})}
async function setCover(id,button){await busy(button,async()=>{await API.edge('admin-actions',{action:'cover',id});toast('تم تعيين الغلاف')})}
async function deleteMedia(id,button){if(!confirm('حذف الملف نهائياً من التخزين والمنتج؟'))return;await busy(button,async()=>{await API.edge('admin-actions',{action:'delete_media',id});button.closest('.tile').remove();toast('تم الحذف')})}
function renderInventory(){const q=$('stockSearch').value.trim();$('inventoryList').innerHTML=variants.filter(v=>!q||(v.product?.name_ar+' '+v.name_ar+' '+v.sku).includes(q)).map(v=>`<div class="card row"><div><b>${esc(v.product?.name_ar)}</b><small style="display:block">${esc(v.name_ar)} • ${esc(v.sku||'')}</small></div><b class="${v.stock<=v.low_stock_limit?'danger':''}">${v.stock}</b><button onclick="stockForm('${v.id}')">تعديل الكمية</button></div>`).join('')||'<div class="empty">لا توجد نتائج.</div>'}
function stockForm(id){const v=variants.find(v=>v.id===id);modal('تعديل المخزون',`<p>${esc(v.product?.name_ar)} — ${esc(v.name_ar)}</p><label>الكمية الجديدة</label><input id="stockValue" type="number" min="0" value="${v.stock}"><label>سبب التعديل</label><input id="stockReason" maxlength="200"><button class="primary" style="margin-top:15px" onclick="saveStock('${id}',${v.stock},this)">حفظ</button>`)}
async function saveStock(id,expected,button){await busy(button,async()=>{const stock=Number($('stockValue').value),reason=$('stockReason').value.trim();if(stock<0||!Number.isInteger(stock)||!reason)return toast('أدخل كمية صحيحة وسبب التعديل');await API.rpc('adjust_stock',{p_id:id,p_expected:expected,p_stock:stock,p_reason:reason});await loadAdminProducts();closeModal();dashboard()})}
async function loadOrders(){orders=await API.query('orders',{select:'*',order:'created_at.desc',limit:'500'});renderOrders();dashboard()}
function renderOrders(){const q=$('orderSearch').value.trim(),status=$('orderFilter').value;$('ordersList').innerHTML=orders.filter(o=>(!q||(o.order_number+' '+o.customer_name+' '+o.phone).includes(q))&&(!status||o.status===status)).map(o=>`<div class="card order-card"><div class="head"><b>${esc(o.order_number)}</b><span class="badge">${esc(labels[o.status])}</span></div><div class="row"><div>${esc(o.customer_name)}<small style="display:block">${esc(o.province+' / '+o.area)} • ${esc(date(o.created_at))}</small><a href="tel:${esc(o.phone.replace(/[^+0-9]/g,''))}">${esc(o.phone)}</a></div><b>${money(o.total)}</b></div><div class="order-actions" style="margin-top:12px"><button class="primary" onclick="openOrder('${o.id}')">التفاصيل</button><button onclick="copyOrder('${o.id}')">نسخ البيانات</button></div></div>`).join('')||'<div class="empty">لا توجد طلبات مطابقة.</div>'}
const transitions={new:['confirmed','cancelled','rejected'],confirmed:['preparing','cancelled'],preparing:['shipped','cancelled'],shipped:['delivered','cancelled'],delivered:[],cancelled:[],rejected:[]};
async function openOrder(id){try{const [oo,items,hh]=await Promise.all([API.query('orders',{select:'*',id:'eq.'+id}),API.query('order_items',{select:'*',order_id:'eq.'+id}),API.query('order_status_history',{select:'*',order_id:'eq.'+id,order:'created_at'})]);const o=oo[0];modal(o.order_number,`<div class="panel"><h3>${esc(o.customer_name)}</h3><p>${esc(o.phone)}${o.alt_phone?' / '+esc(o.alt_phone):''}</p><p>${esc(o.province+' / '+o.area)}<br>${esc(o.address)}<br>${esc(o.landmark)}</p><p>${esc(o.notes)}</p></div><div class="panel">${items.map(i=>`<div class="row"><div><b>${esc(i.product_name_snapshot)}</b><small style="display:block">${esc(i.variant_name_snapshot)} ${i.box_name_snapshot?' / '+esc(i.box_name_snapshot):''} • العدد ${i.quantity}</small></div><b>${money(i.line_total)}</b></div>`).join('<hr>')}<div class="row"><span>التوصيل</span><b>${money(o.delivery_fee)}</b></div><div class="row"><span>الخصم</span><b>${money(o.discount)}</b></div><div class="total"><span>الإجمالي</span><b>${money(o.total)}</b></div></div>${timeline(hh)}<div class="no-print"><label>ملاحظة داخلية</label><textarea id="adminNote" maxlength="1000">${esc(o.admin_notes||'')}</textarea><button onclick="saveOrderNote('${id}',this)">حفظ الملاحظة</button><h3 style="margin-top:20px">تحديث الحالة</h3><div class="order-actions">${(transitions[o.status]||[]).map(s=>`<button class="${['cancelled','rejected'].includes(s)?'danger':'primary'}" onclick="changeStatus('${id}','${s}',this)">${labels[s]}</button>`).join('')||'<p>الطلب بحالة نهائية.</p>'}</div><button style="margin-top:15px" onclick="printOrder()">طباعة فاتورة / بيانات التجهيز</button></div>`)}catch(e){showError(e)}}
async function changeStatus(id,status,button){if(['cancelled','rejected'].includes(status)&&!confirm('تأكيد إلغاء الطلب وإرجاع الكميات للمخزون؟'))return;await busy(button,async()=>{await API.rpc('update_order_status',{p_order_id:id,p_status:status,p_note:labels[status]});await loadOrders();if(can('content'))await loadAdminProducts();closeModal();toast('تم تحديث الطلب')})}
async function saveOrderNote(id,button){await busy(button,async()=>{await API.edge('admin-actions',{action:'order_notes',id,notes:$('adminNote').value});toast('تم حفظ الملاحظة')})}
async function copyOrder(id){const o=orders.find(o=>o.id===id);try{await copyText([o.order_number,o.customer_name,o.phone,o.province,o.area,o.address,o.landmark,'الإجمالي: '+o.total].filter(Boolean).join('\n'));toast('تم نسخ البيانات')}catch{toast('تعذر النسخ')}}
function dashboard(){const today=new Date().toISOString().slice(0,10);$('dashboardStats').innerHTML=[['المنتجات',adminProducts.length],['طلبات جديدة',orders.filter(o=>o.status==='new').length],['مخزون منخفض',variants.filter(v=>v.active&&v.stock<=v.low_stock_limit).length],['مبيعات اليوم',money(orders.filter(o=>o.status==='delivered'&&o.updated_at.slice(0,10)===today).reduce((s,o)=>s+o.total,0))]].map(([n,v])=>`<div class="stat"><small>${n}</small><b>${v}</b></div>`).join('');$('recentOrders').innerHTML=can('orders')?orders.slice(0,5).map(o=>`<div class="card row"><span>${esc(o.order_number)} — ${esc(o.customer_name)}</span><button onclick="openOrder('${o.id}')">عرض</button></div>`).join(''):'<p class="small">تتوفر لك أدوات المحتوى والمخزون.</p>'}
async function loadBoxes(){adminBoxes=await API.query('boxes',{select:'*',order:'created_at'});$('boxesList').innerHTML=adminBoxes.map(b=>`<div class="card row"><div><b>${esc(b.name_ar)}</b><small style="display:block">${money(b.price)} • ${b.stock} قطعة • ${b.active?'متاحة':'مخفية'}</small></div><button onclick="boxForm('${b.id}')">تعديل</button></div>`).join('')||'<div class="empty">لا توجد علب.</div>'}
function boxForm(id=null){const b=adminBoxes.find(b=>b.id===id)||{name_ar:'',price:0,stock:0,active:true};modal('العلبة',`<label>الاسم</label><input id="boxName" value="${esc(b.name_ar)}"><label>السعر</label><input id="boxPrice" type="number" min="0" value="${b.price}"><label>المخزون</label><input id="boxStock" type="number" min="0" value="${b.stock}"><label class="gap"><input id="boxActive" type="checkbox" style="width:auto" ${b.active?'checked':''}> متاحة</label><label>صورة — 20 ميجا كحد أقصى</label><input id="boxFile" type="file" accept="image/jpeg,image/png,image/webp"><button class="primary" style="margin-top:15px" onclick="saveBox('${id||''}',${b.stock},this)">حفظ</button>`)}
async function saveBox(id,expected,button){await busy(button,async()=>{const f=$('boxFile').files[0];if(f?.size>CFG.maxFile)throw new Error('FILE_TOO_LARGE');const boxId=await API.rpc('save_box',{p_data:{id:id||null,name_ar:$('boxName').value.trim(),price:Number($('boxPrice').value),stock:Number($('boxStock').value),active:$('boxActive').checked,expected_stock:expected}});if(f){const fd=new FormData();fd.append('file',f);fd.append('entity_type','box');fd.append('box_id',boxId);await API.edge('telegram-upload',fd)}await loadBoxes();closeModal();toast('تم حفظ العلبة')})}
async function loadReviews(){adminReviews=await API.query('reviews',{select:'*',order:'created_at.desc',limit:'300'});$('reviewsList').innerHTML=adminReviews.map(r=>`<div class="card"><div class="row"><b>${esc(r.customer_name)} — ${r.rating}/5</b><span class="badge">${r.approved?'منشور':'قيد المراجعة'}</span></div><p>${esc(r.comment)}</p><button onclick="approveReview('${r.id}',${!r.approved},this)">${r.approved?'إخفاء':'اعتماد'}</button></div>`).join('')||'<div class="empty">لا توجد تقييمات.</div>'}
async function approveReview(id,approved,button){await busy(button,async()=>{await API.query('reviews',{id:'eq.'+id},'PATCH',{approved});await loadReviews()})}
async function loadBanners(){adminBanners=await API.query('banners',{select:'*',order:'sort_order'});$('bannersList').innerHTML=adminBanners.map(b=>`<div class="card row"><span>${esc(b.title_ar)} — ${b.active?'ظاهر':'مخفي'}</span><button onclick="bannerForm('${b.id}')">تعديل</button></div>`).join('')||'<div class="empty">لا توجد بنرات.</div>'}
function bannerForm(id=null){const b=adminBanners.find(x=>x.id===id)||{};modal('بنر المتجر',`<label>العنوان</label><input id="bannerTitle" value="${esc(b.title_ar)}"><label>الوصف</label><input id="bannerSubtitle" value="${esc(b.subtitle_ar)}"><label>رابط صورة HTTPS — اختياري</label><input id="bannerImage" value="${esc(b.image_url)}"><label>المنتج المرتبط</label><select id="bannerProduct"><option value="">بدون منتج</option>${adminProducts.map(p=>`<option value="${p.id}" ${b.product_id===p.id?'selected':''}>${esc(p.name_ar)}</option>`).join('')}</select><label>الترتيب</label><input id="bannerSort" type="number" value="${b.sort_order||0}"><label class="gap"><input id="bannerActive" type="checkbox" style="width:auto" ${b.active!==false?'checked':''}> ظاهر</label><button class="primary" style="margin-top:15px" onclick="saveBanner('${id||''}',this)">حفظ</button>`)}
async function saveBanner(id,button){await busy(button,async()=>{const image=$('bannerImage').value.trim();if(image&&!safeUrl(image))return toast('أدخل رابط HTTPS صحيح');const b={title_ar:$('bannerTitle').value.trim(),subtitle_ar:$('bannerSubtitle').value.trim(),image_url:image||null,product_id:$('bannerProduct').value||null,sort_order:Number($('bannerSort').value),active:$('bannerActive').checked};if(!b.title_ar)return toast('أدخل العنوان');await API.query('banners',id?{id:'eq.'+id}:{},id?'PATCH':'POST',b);await loadBanners();closeModal()})}
async function loadSettings(){const rows=await API.query('app_settings',{select:'key,value'});storeSettings=Object.fromEntries(rows.map(r=>[r.key,r.value]));const s=storeSettings.store||{},d=storeSettings.delivery||{};$('settingsForm').innerHTML=`<label>اسم المتجر</label><input id="storeName" value="${esc(s.display_name||'طراز')}"><label>نبذة</label><textarea id="storeBio">${esc(s.bio||'')}</textarea><label>رابط إنستغرام</label><input id="instagramUrl" value="${esc(s.instagram_url||'https://instagram.com/tiraz.select')}"><label>سياسة التوصيل</label><textarea id="deliveryPolicy">${esc(s.delivery_policy||'')}</textarea><label>سياسة الاستبدال</label><textarea id="returnPolicy">${esc(s.return_policy||'')}</textarea><label>أجرة التوصيل الافتراضية</label><input id="defaultFee" type="number" min="0" value="${d.default_fee||0}"><h3>أجور المحافظات</h3><div class="grid2">${provinces.map(p=>`<div><label>${p}</label><input data-province="${p}" type="number" min="0" placeholder="الأجرة الافتراضية" value="${d.province_fees?.[p]??''}"></div>`).join('')}</div><label>معرّف تطبيق الإشعارات</label><input id="oneSignalId" value="${esc(storeSettings.onesignal?.app_id||'')}"><button class="primary" style="margin-top:15px" onclick="saveSettings(this)">حفظ الإعدادات</button>`;}
async function saveSettings(button){await busy(button,async()=>{const fees={};document.querySelectorAll('[data-province]').forEach(i=>{if(i.value!=='')fees[i.dataset.province]=Number(i.value)});if(Number($('defaultFee').value)<0||Object.values(fees).some(n=>n<0))return toast('أجور التوصيل لا تكون سالبة');await API.query('app_settings',{},'POST',[{key:'store',value:{...storeSettings.store,display_name:$('storeName').value.trim(),bio:$('storeBio').value.trim(),instagram_url:safeUrl($('instagramUrl').value.trim()),delivery_policy:$('deliveryPolicy').value.trim(),return_policy:$('returnPolicy').value.trim()},is_public:true},{key:'delivery',value:{enabled:true,default_fee:Number($('defaultFee').value),province_fees:fees},is_public:true},{key:'onesignal',value:{app_id:$('oneSignalId').value.trim()},is_public:true}]);await loadSettings();await setupPush('admin-'+adminUser.id,'admin');toast('تم الحفظ')})}
async function loadIntegrations(){try{const j=await API.edge('admin-actions',{action:'integrations'});$('integrationState').textContent=`البوت: ${j.bot_configured?'محفوظ':'غير مضاف'} • مفتاح الإشعارات: ${j.onesignal_key_configured?'محفوظ':'غير مضاف'}`;$('channels').innerHTML=purposes.map(([k,n])=>`<label>${n}</label><input data-purpose="${k}" value="${esc(j.channels?.find(c=>c.purpose===k)?.channel_id||'')}" placeholder="-100xxxxxxxxxx">`).join('');$('outboxList').innerHTML=(j.outbox||[]).map(r=>`<div class="card row"><span>${esc(r.kind)} — ${esc(r.state)}<small style="display:block">${esc(r.last_error||'')} • محاولات ${r.attempts}</small></span>${['failed','blocked'].includes(r.state)?`<button onclick="retryOutbox('${r.id}',this)">إعادة المحاولة</button>`:''}</div>`).join('')||'<p>لا توجد رسائل معلّقة.</p>';}catch(e){showError(e)}}
async function saveIntegrations(button){await busy(button,async()=>{await API.edge('admin-actions',{action:'save_integrations',telegram_bot_token:$('botToken').value.trim(),onesignal_rest_key:$('oneSignalKey').value.trim(),channels:[...document.querySelectorAll('[data-purpose]')].map(i=>({purpose:i.dataset.purpose,channel_id:i.value.trim(),enabled:!!i.value.trim()}))});$('botToken').value='';$('oneSignalKey').value='';await loadIntegrations();toast('تم حفظ الربط')})}
async function testTelegram(button){await busy(button,async()=>{const j=await API.edge('admin-actions',{action:'test_telegram'});$('integrationState').textContent='@'+j.username+' • '+j.channels.map(c=>(purposes.find(p=>p[0]===c.purpose)?.[1]||c.purpose)+': '+(c.ok?'صلاحية نشر متاحة':'تحتاج صلاحية نشر')).join(' / ')})}
async function retryOutbox(id,button){await busy(button,async()=>{await API.edge('admin-actions',{action:'retry_outbox',id});await loadIntegrations();toast('ستُعاد المحاولة تلقائياً')})}
async function broadcast(button){if(!confirm('إرسال هذا الإشعار إلى المشتركين بإشعارات المتجر؟'))return;await busy(button,async()=>{const j=await API.edge('send-notification',{title:$('notifyTitle').value.trim(),message:$('notifyMessage').value.trim(),url:$('notifyUrl').value.trim()});toast('تم قبول الإرسال'+(j.recipients!=null?' إلى '+j.recipients+' مشترك':'') )})}
async function loadTeam(){try{const j=await API.edge('admin-actions',{action:'list_admins'});$('teamList').innerHTML=j.admins.map(a=>`<div class="card"><small>${esc(a.user_id)}</small><div class="row"><span>${esc(a.role)} • ${a.active?'نشط':'معطّل'}</span>${a.role!=='owner'?`<button onclick="teamForm('${a.user_id}','${a.role}',${a.active})">تعديل</button>`:'<span>المالك الأساسي</span>'}</div></div>`).join('')}catch(e){showError(e)}}
function teamForm(id,role,active){modal('صلاحيات المشرف',`<label>الدور</label><select id="teamRole">${['admin','orders','content'].map(k=>`<option value="${k}" ${k===role?'selected':''}>${{admin:'إدارة عامة',orders:'الطلبات فقط',content:'المحتوى والمخزون'}[k]}</option>`).join('')}</select><label class="gap"><input id="teamActive" type="checkbox" style="width:auto" ${active?'checked':''}> نشط</label><button class="primary" onclick="updateTeam('${id}',this)">حفظ</button>`)}
async function updateTeam(id,button){await busy(button,async()=>{await API.edge('admin-actions',{action:'update_admin',id,role:$('teamRole').value,active:$('teamActive').checked});await loadTeam();closeModal()})}
async function inviteTeam(button){await busy(button,async()=>{await API.edge('admin-actions',{action:'invite_admin',email:$('inviteEmail').value.trim(),role:$('inviteRole').value});toast('أُرسلت دعوة الحساب');$('inviteEmail').value='';await loadTeam()})}
async function loadAudit(){try{const rows=await API.query('audit_log',{select:'action,entity_id,created_at',order:'created_at.desc',limit:'100'});const names={save_product:'حفظ منتج',publish:'تغيير نشر المنتج',order_status:'تغيير حالة طلب',save_integrations:'تحديث الربط',adjust_stock:'تعديل المخزون',save_box:'حفظ علبة',broadcast:'إرسال إشعار',update_admin:'تحديث مشرف',invite_admin:'دعوة مشرف',delete_media:'حذف وسائط',order_notes:'ملاحظات طلب'};$('auditList').innerHTML=rows.map(r=>`<div class="card row"><span>${esc(names[r.action]||r.action)}<small style="display:block">${esc(r.entity_id)}</small></span><small>${esc(date(r.created_at))}</small></div>`).join('')||'<p>لا توجد عمليات مسجّلة.</p>'}catch(e){showError(e)}}
function adminPasswordForm(){modal('كلمة مرور الحساب','<label>كلمة المرور الجديدة — 8 أحرف على الأقل</label><input id="adminNewPassword" type="password"><label>تأكيد كلمة المرور</label><input id="adminConfirmPassword" type="password"><button class="primary" onclick="saveAdminPassword(this)">حفظ</button>')}
async function saveAdminPassword(button){await busy(button,async()=>{const p=$('adminNewPassword').value;if(p.length<8||p!==$('adminConfirmPassword').value)return toast('تحقق من كلمة المرور وتأكيدها');await API.password(p);closeModal();await enterAdmin()})}
async function adminReset(button){await busy(button,async()=>{const email=$('email').value.trim();if(!email.includes('@'))return toast('أدخل بريد الحساب');await API.reset(email);toast('تحقق من بريدك لاستعادة كلمة المرور')})}
async function startAdmin(){const recovery=await API.recover().catch(()=>false);if(recovery){adminPasswordForm();return}try{await enterAdmin()}catch(e){showError(e)}}
startAdmin();

</script></body></html>
