name: Deploy Tiraz Store

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "android-admin/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build hybrid admin APK
        working-directory: android-admin
        run: gradle :app:assembleDebug

      - name: Add APK to website downloads
        run: |
          mkdir -p web/downloads
          cp android-admin/app/build/outputs/apk/debug/app-debug.apk web/downloads/tiraz-admin.apk

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
