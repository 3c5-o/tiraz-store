function readLocal(key,fallback){try{return JSON.parse(localStorage.getItem(key))??fallback}catch{return fallback}}
function writeLocal(key,value){try{localStorage.setItem(key,JSON.stringify(value))}catch{}}
function toast(text){$('toast').textContent=text;$('toast').classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('toast').classList.remove('show'),3500)}
function showError(e){toast(errors[e.message]||(/network|fetch|timeout/i.test(e.message)?'تعذر الاتصال، حاول مجدداً':'تعذر إكمال العملية. '+(e.message?.startsWith('HTTP')?'حاول مجدداً':'')))}
async function busy(button,fn){if(button?.disabled)return;const text=button?.textContent;if(button){button.disabled=true;button.textContent='جاري التنفيذ…'}try{return await fn()}catch(e){showError(e)}finally{if(button){button.disabled=false;button.textContent=text}}}
const API=(()=>{let refreshTask=null,session=readLocal('tiraz_session_v3',null)||readLocal('tiraz_admin_session_v2',null);const listeners=[];
function save(s){session=s;writeLocal('tiraz_session_v3',s);listeners.forEach(fn=>fn(s))}
async function raw(path,options={}){const r=await fetch(CFG.url+path,{...options,signal:options.signal||AbortSignal.timeout(90000),headers:{apikey:CFG.key,...options.headers}});const text=await r.text();let data;try{data=text?JSON.parse(text):null}catch{data=null}if(!r.ok)throw new Error(data?.error||data?.error_description||data?.msg||data?.message||'HTTP '+r.status);return data}
async function fresh(){if(!session)return null;if(session.expires_at>Date.now()/1000+90)return session;if(!refreshTask)refreshTask=(async()=>{try{const j=await raw('/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({refresh_token:session.refresh_token})});save({...j,expires_at:Date.now()/1000+j.expires_in});return session}catch(e){if(!/fetch|timeout/i.test(e.message))save(null);throw e}finally{refreshTask=null}})();return refreshTask}
async function request(path,options={}){const s=await fresh();return raw(path,{...options,headers:{...(s?{Authorization:'Bearer '+s.access_token}:{}),...options.headers}})}
return {onAuth(fn){listeners.push(fn)},async session(){return fresh()},async signIn(email,password){const j=await raw('/auth/v1/token?grant_type=password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password})});save({...j,expires_at:Date.now()/1000+j.expires_in});return session},async signUp(email,password,name){const j=await raw('/auth/v1/signup?redirect_to='+encodeURIComponent(location.origin+location.pathname),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password,data:{full_name:name}})});if(j.access_token)save({...j,expires_at:Date.now()/1000+j.expires_in});return j},async signOut(){try{await request('/auth/v1/logout',{method:'POST'})}finally{save(null)}},async reset(email){return raw('/auth/v1/recover?redirect_to='+encodeURIComponent(location.origin+location.pathname),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email})})},async password(password){return request('/auth/v1/user',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({password})})},async recover(){const p=new URLSearchParams(location.hash.slice(1));if(p.get('access_token')){const token=p.get('access_token');const user=await raw('/auth/v1/user',{headers:{Authorization:'Bearer '+token}});save({access_token:token,refresh_token:p.get('refresh_token'),expires_at:Date.now()/1000+Number(p.get('expires_in')||3600),user});history.replaceState(null,'',location.pathname+location.search);return p.get('type')==='recovery'||p.get('type')==='invite'}return false},async query(table,params={},method='GET',payload){const q=new URLSearchParams(params);return request('/rest/v1/'+table+'?'+q,{method,headers:{'Content-Type':'application/json',...(method==='POST'?{Prefer:'resolution=merge-duplicates,return=representation'}:method==='PATCH'?{Prefer:'return=representation'}:{})},body:payload===undefined?undefined:JSON.stringify(payload)})},async rpc(name,args={}){return request('/rest/v1/rpc/'+name,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(args)})},async edge(name,data){return request('/functions/v1/'+name,{method:'POST',headers:data instanceof FormData?{}:{'Content-Type':'application/json'},body:data instanceof FormData?data:JSON.stringify(data)})}}})();
function mediaUrl(m){return m?.proxy_key?CFG.url+'/functions/v1/media?key='+encodeURIComponent(m.proxy_key):''}
function safeUrl(s){try{const u=new URL(s);return u.protocol==='https:'?u.href:''}catch{return ''}}
function modal(title,html){$('modalTitle').textContent=title;$('modalBody').innerHTML=html;const wasOpen=$('modal').classList.contains('open');$('modal').classList.add('open');document.body.classList.add('locked');if(!wasOpen)history.pushState({modal:true},'');}
function hideModal(){document.querySelectorAll('#modal video').forEach(v=>v.pause());$('modal').classList.remove('open');document.body.classList.remove('locked')}
function closeModal(){if($('modal').classList.contains('open')&&history.state?.modal)history.back();else hideModal()}
function timeline(historyRows){return '<div class="timeline">'+(historyRows||[]).map(h=>'<div><b>'+esc(labels[h.status]||h.status)+'</b><small>'+esc(date(h.created_at))+'</small></div>').join('')+'</div>'}
let pushReady=false,pushInstance=null;
async function setupPush(alias,audience){const rows=await API.query('app_settings',{select:'value',key:'eq.onesignal'});const id=rows?.[0]?.value?.app_id;if(!id)return false;
if(window.TirazNative?.configurePush){window.TirazNative.configurePush(id,alias);pushReady=true;return true}
window.OneSignalDeferred=window.OneSignalDeferred||[];if(!$('pushSdk')){const s=document.createElement('script');s.id='pushSdk';s.src='https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js';s.defer=true;document.head.appendChild(s)}
OneSignalDeferred.push(async O=>{try{if(!pushInstance){await O.init({appId:id,serviceWorkerPath:'/tiraz-store/onesignal/OneSignalSDKWorker.js',serviceWorkerParam:{scope:'/tiraz-store/onesignal/'}});pushInstance=O}await O.login(alias);await O.User.addTags({audience});pushReady=true}catch{pushReady=false}});return true}
async function enablePush(){if(!pushReady)return toast('الإشعارات غير جاهزة حالياً، حاول بعد اكتمال الإعداد');if(window.TirazNative){window.TirazNative.requestPush();return}await pushInstance.Notifications.requestPermission();toast(pushInstance.Notifications.permission?'تم تفعيل الإشعارات':'لم تمنح إذن الإشعارات')}

let products=[],boxes=[],reviews=[],banners=[],settings={},currentUser=null,currentProfile=null,activeFilter='all',selectedProduct=null,selectedVariant=null,selectedBox=null;
let cart=readLocal('tiraz_cart',[]),favorites=new Set(readLocal('tiraz_favs',[])),pushAlias=readLocal('tiraz_push_alias',null);
if(!pushAlias){pushAlias='browser-'+crypto.randomUUID();writeLocal('tiraz_push_alias',pushAlias)}
if(!Array.isArray(cart))cart=[];
function nav(view,push=true){hideModal();document.querySelectorAll('.view').forEach(e=>e.classList.toggle('active',e.id===view+'View'));document.querySelectorAll('.bottom button').forEach(e=>e.classList.toggle('active',e.dataset.view===view));if(push)history.pushState({view},'');scrollTo(0,0);if(view==='profile')renderProfile();}
window.addEventListener('popstate',()=>{if(history.state?.modal)return;hideModal();nav(history.state?.view||'home',false)});
function persistCart(){writeLocal('tiraz_cart',cart);$('cartCount').textContent=cart.reduce((s,x)=>s+x.quantity,0)}
function available(p){return (p.product_variants||[]).some(v=>v.active&&v.stock>0)}
function cover(p){return (p.product_media||[]).find(m=>m.is_cover&&m.media_type==='image')||(p.product_media||[]).find(m=>m.media_type==='image')||(p.product_media||[])[0]}
function card(p){const m=cover(p);return `<article class="product"><button class="fav ${favorites.has(p.id)?'active':''}" aria-label="المفضلة" onclick="toggleFav('${p.id}')">♡</button><button class="open" onclick="openProduct('${p.id}')"><div class="cover">${m?m.media_type==='video'?`<video src="${mediaUrl(m)}" preload="metadata" muted playsinline></video>`:`<img src="${mediaUrl(m)}" loading="lazy" alt="${esc(p.name_ar)}">`:'طِراز'}</div><div class="info"><small>${esc(p.brand?.name||'طراز')}</small><div>${esc(p.name_ar)}</div><div class="price">${money(p.base_price)}</div>${p.compare_at_price?`<small><s>${money(p.compare_at_price)}</s></small>`:''}${!available(p)?'<div class="badge">نفد المخزون</div>':''}</div></button></article>`}
function renderCatalog(){let rows=products.filter(p=>(activeFilter==='all'||p.category?.slug===activeFilter||p.gender===activeFilter||p.style===activeFilter)&&(!String($('searchInput').value||'').trim()||(p.name_ar+' '+p.name_en+' '+p.brand?.name).toLowerCase().includes($('searchInput').value.trim().toLowerCase()))&&(!$('onlyStock').checked||available(p)));const sort=$('sortProducts').value;if(sort==='low')rows.sort((a,b)=>a.base_price-b.base_price);if(sort==='high')rows.sort((a,b)=>b.base_price-a.base_price);if(sort==='new')rows.sort((a,b)=>new Date(b.created_at||0)-new Date(a.created_at||0));$('searchProducts').innerHTML=rows.length?rows.map(card).join(''):'<div class="empty">لا توجد منتجات مطابقة.</div>';$('homeProducts').innerHTML=products.slice(0,8).map(card).join('')||'<div class="empty">تشكيلة طراز تتجهّز، ترقّب الجديد.</div>';$('favoriteProducts').innerHTML=products.filter(p=>favorites.has(p.id)).map(card).join('')||'<div class="empty">لم تضف منتجات للمفضلة بعد.</div>';$('banners').innerHTML=banners.map(b=>`<div class="banner">${safeUrl(b.image_url)?`<img src="${esc(safeUrl(b.image_url))}" alt="">`:''}<h3>${esc(b.title_ar)}</h3><p>${esc(b.subtitle_ar)}</p>${b.product_id?`<button class="primary" onclick="openProduct('${b.product_id}')">عرض المنتج</button>`:''}</div>`).join('');}
async function loadStore(){try{$('homeProducts').innerHTML='<div class="skeleton"></div><div class="skeleton"></div>';[products,boxes,reviews,banners]=await Promise.all([API.rpc('list_store_products'),API.rpc('list_active_boxes'),API.rpc('list_public_reviews'),API.query('banners',{select:'*',active:'eq.true',order:'sort_order'})]);const ss=await API.query('app_settings',{select:'key,value'});settings=Object.fromEntries((ss||[]).map(x=>[x.key,x.value]));$('brandName').textContent=settings.store?.display_name||'طِراز';renderCatalog();const id=new URLSearchParams(location.search).get('product');if(id&&products.some(x=>x.id===id))openProduct(id);await setupPush(pushAlias,'customer');}catch(e){$('homeProducts').innerHTML='<div class="empty">تعذر تحميل المنتجات.<br><button onclick="loadStore()">إعادة المحاولة</button></div>';showError(e)}}
function filterCategory(id){activeFilter=id;document.querySelectorAll('[data-filter]').forEach(b=>b.classList.toggle('selected',b.dataset.filter===id));nav('search');renderCatalog();}
async function toggleFav(id){favorites.has(id)?favorites.delete(id):favorites.add(id);writeLocal('tiraz_favs',[...favorites]);renderCatalog();if(currentUser)try{if(favorites.has(id))await API.query('favorites',{},'POST',{user_id:currentUser.id,product_id:id});else await API.query('favorites',{user_id:'eq.'+currentUser.id,product_id:'eq.'+id},'DELETE')}catch(e){showError(e)}}
function openProduct(id){selectedProduct=products.find(p=>p.id===id);if(!selectedProduct)return;selectedVariant=selectedProduct.product_variants.find(v=>v.active&&v.stock>0)||selectedProduct.product_variants[0]||null;selectedBox=null;modal(selectedProduct.name_ar,productDetail());}
function productDetail(){const p=selectedProduct,m=p.product_media||[],rr=reviews.filter(r=>r.product_id===p.id);return `<div class="gallery">${m.length?m.map(x=>`<div>${x.media_type==='video'?`<video controls playsinline preload="metadata" src="${mediaUrl(x)}"></video>`:`<img onclick="this.classList.toggle('zoom')" src="${mediaUrl(x)}" alt="${esc(p.name_ar)}">`}</div>`).join(''):'<div>طِراز</div>'}</div><small>اسحب لعرض الوسائط، واضغط الصورة للتكبير</small><div class="row"><h2>${esc(p.name_ar)}</h2><button onclick="shareProduct('${p.id}')">مشاركة</button></div><p>${esc(p.description_ar||'قطعة مختارة بعناية من طراز.')}</p><div id="variantArea">${variantArea()}</div><label>علبة لكل قطعة — اختياري</label><div class="chips"><button class="chip selected" id="boxNone" onclick="selectBox(null)">بدون علبة</button>${boxes.filter(b=>b.stock>0).map(b=>`<button class="chip" data-box="${b.id}" onclick="selectBox('${b.id}')">${esc(b.name_ar)} — ${money(b.price)}</button>`).join('')}</div><button class="primary" style="width:100%" id="addCartButton" ${!selectedVariant||selectedVariant.stock<=0?'disabled':''} onclick="addToCart()">إضافة للسلة</button><div class="panel" style="margin-top:18px"><h3>التوصيل والاستبدال</h3><p>${esc(settings.store?.delivery_policy||'نراجع تفاصيل الطلب معك قبل التجهيز. أجور التوصيل تظهر قبل تأكيد الطلب.')}</p><p>${esc(settings.store?.return_policy||'للاستفسار عن الاستبدال تواصل مع المتجر قبل إتمام الطلب.')}</p></div><h3>آراء الزبائن</h3>${rr.map(r=>`<div class="review"><b>${esc(r.customer_name)}</b><small> ${r.rating}/5</small><p>${esc(r.comment)}</p></div>`).join('')||'<p class="small">لا توجد تقييمات منشورة بعد.</p>'}${currentUser?'<button class="secondary" onclick="reviewForm()">كتابة تقييم بعد الاستلام</button>':''}`}
function variantArea(){return `<div class="price">${money(selectedVariant?.price_override??selectedProduct.base_price)}</div><label>اللون / الخيار</label><div class="chips">${selectedProduct.product_variants.map(v=>`<button class="chip ${selectedVariant?.id===v.id?'selected':''}" ${v.stock<=0?'disabled':''} onclick="selectVariant('${v.id}')">${esc(v.name_ar)}${v.stock<=0?' — نفد':''}</button>`).join('')}</div><small>المتوفر: ${selectedVariant?.stock||0}</small>`}
function selectVariant(id){selectedVariant=selectedProduct.product_variants.find(v=>v.id===id)||null;$('variantArea').innerHTML=variantArea();$('addCartButton').disabled=!selectedVariant||selectedVariant.stock<=0;}
function selectBox(id){selectedBox=boxes.find(b=>b.id===id)||null;document.querySelectorAll('[data-box]').forEach(e=>e.classList.toggle('selected',e.dataset.box===id));$('boxNone').classList.toggle('selected',!id)}
function addToCart(){if(!selectedVariant||selectedVariant.stock<=0)return toast('هذا الخيار غير متوفر');const key=selectedProduct.id+'|'+selectedVariant.id+'|'+(selectedBox?.id||'');const ex=cart.find(x=>x.key===key),quantity=(ex?.quantity||0)+1;const variantTotal=cart.filter(x=>x.variant_id===selectedVariant.id).reduce((s,x)=>s+x.quantity,0)+1;if(variantTotal>selectedVariant.stock||quantity>20)return toast('وصلت للكمية المتاحة');if(selectedBox&&cart.filter(x=>x.box_id===selectedBox.id).reduce((s,x)=>s+x.quantity,0)+1>selectedBox.stock)return toast('كمية العلب غير كافية');if(ex)ex.quantity=quantity;else cart.push({key,product_id:selectedProduct.id,variant_id:selectedVariant.id,box_id:selectedBox?.id||null,quantity});persistCart();closeModal();toast('تمت الإضافة للسلة')}
function cartRow(x){const p=products.find(p=>p.id===x.product_id),v=p?.product_variants.find(v=>v.id===x.variant_id),b=boxes.find(b=>b.id===x.box_id);return {p,v,b,price:Number(v?.price_override??p?.base_price??0),box:Number(b?.price||0)}}
function subtotal(){return cart.reduce((s,x)=>{const r=cartRow(x);return s+(r.price+r.box)*x.quantity},0)}
function openCart(){modal('سلة التسوق',cartHtml())}
function cartHtml(){return cart.length?cart.map((x,i)=>{const r=cartRow(x),m=r.p&&cover(r.p);return `<div class="cartitem">${m&&m.media_type==='image'?`<img src="${mediaUrl(m)}" alt="">`:'<div>طراز</div>'}<div><b>${esc(r.p?.name_ar||'منتج غير متوفر')}</b><small style="display:block">${esc(r.v?.name_ar||'')}${r.b?' / '+esc(r.b.name_ar):''}</small><span class="price">${money(r.price+r.box)} للقطعة</span><div class="quantity"><button aria-label="تقليل الكمية" onclick="changeQty(${i},-1)">−</button><span>${x.quantity}</span><button aria-label="زيادة الكمية" onclick="changeQty(${i},1)">+</button></div></div><button class="danger" onclick="removeItem(${i})">حذف</button></div>`}).join('')+`<div class="total"><span>المنتجات والعلب</span><span>${money(subtotal())}</span></div><small>تظهر أجور التوصيل بعد اختيار المحافظة.</small><button class="primary" style="width:100%;margin-top:15px" onclick="checkout(this)">متابعة الطلب</button>`:'<div class="empty">السلة فارغة.</div>'}
function removeItem(i){cart.splice(i,1);persistCart();$('modalBody').innerHTML=cartHtml()}
function changeQty(i,delta){const x=cart[i],r=cartRow(x),q=x.quantity+delta;if(q<1)return removeItem(i);if(q>20||!r.v||cart.filter(y=>y.variant_id===x.variant_id).reduce((s,y)=>s+y.quantity,0)+delta>r.v.stock||r.b&&cart.filter(y=>y.box_id===x.box_id).reduce((s,y)=>s+y.quantity,0)+delta>r.b.stock)return toast('الكمية غير متوفرة');x.quantity=q;persistCart();$('modalBody').innerHTML=cartHtml()}
async function checkout(button){await busy(button,async()=>{const previous=subtotal();[products,boxes]=await Promise.all([API.rpc('list_store_products'),API.rpc('list_active_boxes')]);const ss=await API.query('app_settings',{select:'key,value'});settings=Object.fromEntries(ss.map(x=>[x.key,x.value]));if(cart.some(x=>{const r=cartRow(x);return !r.p||!r.v||r.v.stock<x.quantity||x.box_id&&(!r.b||r.b.stock<x.quantity)})){$('modalBody').innerHTML=cartHtml();return toast('تغيّر توفر بعض العناصر، راجع السلة')}if(previous!==subtotal()){$('modalBody').innerHTML=cartHtml();return toast('تغيّرت الأسعار، راجع الإجمالي ثم تابع')}checkoutForm()})}
function checkoutForm(){const saved=readLocal('tiraz_address',{}),address=currentProfile?.addresses?.[0]||saved;const field=(id,label,value,type='text')=>`<div><label>${label}</label><input id="${id}" type="${type}" value="${esc(value||'')}" maxlength="${id==='coPhone'?15:100}"></div>`;$('modalTitle').textContent='إتمام الطلب';$('modalBody').innerHTML=`${currentProfile?.addresses?.length?'<label>عنوان محفوظ</label><select id="savedAddress" onchange="fillAddress(this.value)">'+currentProfile.addresses.map((a,i)=>`<option value="${i}">${esc(a.province+' / '+a.area)}</option>`).join('')+'</select>':''}<div class="grid2">${field('coName','الاسم الكامل *',currentProfile?.full_name||saved.customer_name)}${field('coPhone','رقم الهاتف *',currentProfile?.phone||saved.phone,'tel')}${field('coAlt','رقم احتياطي',saved.alt_phone,'tel')}<div><label>المحافظة *</label><select id="coProvince" onchange="updateCheckoutTotal()">${provinces.map(p=>`<option ${p===address.province?'selected':''}>${p}</option>`).join('')}</select></div>${field('coArea','المنطقة / القضاء *',address.area)}${field('coLandmark','أقرب نقطة دالة',address.landmark)}<div class="full"><label>العنوان بالتفصيل</label><textarea id="coAddress" maxlength="500">${esc(address.address||'')}</textarea></div><div class="full"><label>ملاحظات الطلب</label><textarea id="coNotes" maxlength="1000"></textarea></div></div><div id="checkoutTotal"></div><label class="gap"><input style="width:auto" type="checkbox" id="saveAddress" checked> حفظ بياناتي لتسهيل الطلب القادم</label><p class="small">الدفع عند الاستلام. تأكد من البيانات والإجمالي قبل التأكيد.</p><button class="primary" id="placeOrderButton" style="width:100%" onclick="placeOrder(this)">تأكيد الطلب</button>`;updateCheckoutTotal()}
function fillAddress(index){const a=currentProfile.addresses[index];for(const k of ['province','area','landmark','address'])$('co'+k[0].toUpperCase()+k.slice(1)).value=a[k]||'';updateCheckoutTotal()}
function deliveryFee(){const d=settings.delivery||{};return Number(d.province_fees?.[$('coProvince').value]??d.default_fee??0)}
function updateCheckoutTotal(){$('checkoutTotal').innerHTML=`<div class="row"><span>المنتجات والعلب</span><b>${money(subtotal())}</b></div><div class="row"><span>التوصيل</span><b>${money(deliveryFee())}</b></div><div class="total"><span>الإجمالي</span><b>${money(subtotal()+deliveryFee())}</b></div>`}
async function placeOrder(button){await busy(button,async()=>{const customer={customer_name:$('coName').value.trim(),phone:$('coPhone').value.trim(),alt_phone:$('coAlt').value.trim(),province:$('coProvince').value,area:$('coArea').value.trim(),landmark:$('coLandmark').value.trim(),address:$('coAddress').value.trim()},notes=$('coNotes').value.trim();if(!customer.customer_name||!customer.area||!/^[+\d\s-]{10,20}$/.test(customer.phone))return toast('أكمل الاسم والمنطقة ورقم الهاتف الصحيح');const payload={customer,items:cart,notes,expected_total:subtotal()+deliveryFee()},fingerprint=JSON.stringify(payload);let attempt=readLocal('tiraz_order_attempt',null);if(!attempt||attempt.fingerprint!==fingerprint){attempt={id:crypto.randomUUID(),fingerprint};writeLocal('tiraz_order_attempt',attempt)}let data;try{data=await API.edge('create-order',{...payload,request_id:attempt.id,push_alias:pushAlias})}catch(e){if(e.message==='Price changed'){[products,boxes]=await Promise.all([API.rpc('list_store_products'),API.rpc('list_active_boxes')]);const ss=await API.query('app_settings',{select:'key,value'});settings=Object.fromEntries(ss.map(x=>[x.key,x.value]));updateCheckoutTotal()}throw e};if($('saveAddress').checked){writeLocal('tiraz_address',customer);if(currentUser){const addresses=[{province:customer.province,area:customer.area,landmark:customer.landmark,address:customer.address},...(currentProfile?.addresses||[]).filter(a=>a.address!==customer.address)].slice(0,5);await API.query('profiles',{},'POST',{user_id:currentUser.id,full_name:customer.customer_name,phone:customer.phone,addresses}).catch(()=>{})}}cart=[];persistCart();writeLocal('tiraz_order_attempt',null);const receipts=readLocal('tiraz_receipts',[]);receipts.unshift({order_number:data.order_number,phone:customer.phone,total:data.total});writeLocal('tiraz_receipts',receipts.slice(0,30));$('modalTitle').textContent='تم استلام طلبك';$('modalBody').innerHTML=`<div class="panel"><h2>شكراً لطلبك من طراز</h2><p>رقم الطلب: <b>${esc(data.order_number)}</b></p><p>الإجمالي: <b>${money(data.total)}</b></p><button onclick="copyText('${data.order_number}').then(()=>toast('تم النسخ'))">نسخ رقم الطلب</button><button class="primary" onclick="closeModal();nav('profile')">متابعة الطلب</button></div>`;products=await API.rpc('list_store_products');renderCatalog()})}
async function renderProfile(){const s=await API.session().catch(()=>null);currentUser=s?.user||null;const store=settings.store||{};let html=`<div class="panel row"><div><h2>${esc(store.display_name||'طراز')}</h2><p>${esc(store.bio||'ساعات ونظارات مختارة بذوق مختلف.')}</p></div><a href="${esc(safeUrl(store.instagram_url)||'https://instagram.com/tiraz.select')}" target="_blank" rel="noopener">حساب المتجر</a></div>`;if(currentUser){const profiles=await API.query('profiles',{select:'*',user_id:'eq.'+currentUser.id}).catch(()=>[]);currentProfile=profiles[0]||{};html+=`<div class="panel"><h3>${esc(currentProfile.full_name||currentUser.email)}</h3><p>${esc(currentUser.email)}</p><button onclick="addressForm()">عناويني</button> <button onclick="passwordForm()">تغيير كلمة المرور</button> <button class="danger" onclick="logoutUser(this)">تسجيل الخروج</button></div>`;const orders=await API.query('orders',{select:'order_number,status,total,created_at',user_id:'eq.'+currentUser.id,order:'created_at.desc',limit:'50'}).catch(()=>[]);html+='<h3>طلباتي</h3>'+orders.map(o=>`<div class="card row"><div><b>${esc(o.order_number)}</b><small style="display:block">${esc(labels[o.status])} • ${esc(date(o.created_at))}</small></div><b>${money(o.total)}</b></div>`).join('')}else html+='<div class="panel"><h3>حسابك في طراز</h3><p>احفظ عناوينك ومفضلتك وتابع طلباتك.</p><button class="primary" onclick="authForm()">تسجيل الدخول</button> <button onclick="authForm(\'signup\')">إنشاء حساب</button></div>';
html+=`<div class="panel"><h3>تتبع أي طلب</h3><label>رقم الطلب</label><input id="trackNumber"><label>رقم الهاتف</label><input id="trackPhone" type="tel"><button class="primary" style="margin-top:12px" onclick="track(this)">تتبع الطلب</button><div id="trackResult"></div></div><div class="panel"><button class="secondary" onclick="enablePush()">تفعيل الإشعارات</button></div>`;$('profileContent').innerHTML=html;const receipts=readLocal('tiraz_receipts',[]);if(receipts.length){$('trackNumber').value=receipts[0].order_number;$('trackPhone').value=receipts[0].phone}}
async function track(button){await busy(button,async()=>{const j=await API.edge('track-order',{order_number:$('trackNumber').value.trim(),phone:$('trackPhone').value.trim()});$('trackResult').innerHTML=j.order?`<h3 style="margin-top:15px">${esc(j.order.order_number)}</h3><div class="price">${money(j.order.total)}</div>${timeline(j.order.history)}`:'<p>لم يتم العثور على الطلب. تحقق من الرقم والهاتف.</p>'})}
function authForm(mode='login'){modal(mode==='signup'?'إنشاء حساب':mode==='reset'?'استعادة كلمة المرور':'تسجيل الدخول',`${mode==='signup'?'<label>الاسم</label><input id="authName" maxlength="100">':''}<label>البريد الإلكتروني</label><input id="authEmail" type="email">${mode!=='reset'?'<label>كلمة المرور — 8 أحرف على الأقل</label><input id="authPassword" type="password" minlength="8">':''}${mode==='signup'?'<label>تأكيد كلمة المرور</label><input id="authConfirm" type="password">':''}<button class="primary" style="width:100%;margin-top:15px" onclick="submitAuth('${mode}',this)">${mode==='signup'?'إنشاء الحساب':mode==='reset'?'إرسال رابط الاستعادة':'تسجيل الدخول'}</button>${mode==='login'?'<button class="secondary" style="margin-top:12px" onclick="authForm(\'reset\')">نسيت كلمة المرور</button>':''}`)}
async function submitAuth(mode,button){await busy(button,async()=>{const email=$('authEmail').value.trim();if(!email.includes('@'))return toast('أدخل بريداً صحيحاً');if(mode==='reset'){await API.reset(email);toast('أرسلنا رابط الاستعادة إذا كان البريد مسجّلاً');return closeModal()}const password=$('authPassword').value;if(password.length<8)return toast('كلمة المرور 8 أحرف على الأقل');if(mode==='signup'){if(password!==$('authConfirm').value)return toast('تأكيد كلمة المرور غير مطابق');const j=await API.signUp(email,password,$('authName').value.trim());if(!j.access_token)toast('تحقق من بريدك لإكمال التسجيل')}else await API.signIn(email,password);closeModal();await syncFavorites();nav('profile')})}
async function syncFavorites(){const s=await API.session().catch(()=>null);currentUser=s?.user||null;if(!currentUser)return;const saved=await API.query('favorites',{select:'product_id',user_id:'eq.'+currentUser.id});const ids=new Set((saved||[]).map(x=>x.product_id));favorites.forEach(id=>{if(products.some(p=>p.id===id))ids.add(id)});favorites=ids;if(ids.size)await API.query('favorites',{},'POST',[...ids].map(product_id=>({user_id:currentUser.id,product_id})));writeLocal('tiraz_favs',[...ids]);renderCatalog()}
async function logoutUser(button){await busy(button,async()=>{await API.signOut();currentUser=null;currentProfile=null;favorites=new Set();writeLocal('tiraz_favs',[]);renderCatalog();renderProfile()})}
function passwordForm(){modal('كلمة المرور الجديدة','<label>كلمة المرور — 8 أحرف على الأقل</label><input id="newPassword" type="password"><label>تأكيد كلمة المرور</label><input id="newPasswordConfirm" type="password"><button class="primary" style="margin-top:15px" onclick="savePassword(this)">حفظ</button>')}
async function savePassword(button){await busy(button,async()=>{const p=$('newPassword').value;if(p.length<8||p!==$('newPasswordConfirm').value)return toast('تحقق من طول كلمة المرور وتأكيدها');await API.password(p);closeModal();toast('تم تحديث كلمة المرور')})}
function addressForm(){modal('عناويني',`<label>الاسم الكامل</label><input id="profileName" value="${esc(currentProfile?.full_name||'')}"><label>الهاتف</label><input id="profilePhone" value="${esc(currentProfile?.phone||'')}">${(currentProfile?.addresses||[]).map((a,i)=>`<div class="card row"><span>${esc(a.province+' / '+a.area+' / '+a.address)}</span><button onclick="removeAddress(${i})">حذف</button></div>`).join('')}<button class="primary" style="margin-top:15px" onclick="saveProfile(this)">حفظ البيانات</button><p class="small">تُضاف العناوين الجديدة عند إتمام الطلب مع اختيار حفظ البيانات.</p>`)}
function removeAddress(i){currentProfile.addresses.splice(i,1);addressForm()}
async function saveProfile(button){await busy(button,async()=>{await API.query('profiles',{},'POST',{user_id:currentUser.id,full_name:$('profileName').value.trim(),phone:$('profilePhone').value.trim(),addresses:currentProfile.addresses||[]});closeModal();renderProfile()})}
async function shareProduct(id){const p=products.find(p=>p.id===id),url=location.origin+location.pathname+'?product='+id;try{if(navigator.share)await navigator.share({title:p.name_ar,url});else{await copyText(url);toast('تم نسخ رابط المنتج')}}catch{}}
function reviewForm(){modal('تقييم المنتج',`<label>التقييم</label><select id="reviewRating">${[5,4,3,2,1].map(n=>`<option>${n}</option>`).join('')}</select><label>رأيك</label><textarea id="reviewComment" maxlength="1000"></textarea><button class="primary" style="margin-top:15px" onclick="submitReview(this)">إرسال للمراجعة</button>`)}
async function submitReview(button){await busy(button,async()=>{await API.rpc('submit_review',{p_product_id:selectedProduct.id,p_rating:Number($('reviewRating').value),p_comment:$('reviewComment').value.trim()});closeModal();toast('تم إرسال التقييم للمراجعة')})}
async function startStore(){persistCart();history.replaceState({view:'home'},'');const recovery=await API.recover().catch(()=>false);await loadStore();await syncFavorites().catch(showError);if(recovery)passwordForm();}
startStore();

if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});</script></body></html>
