name: Deploy Tiraz Store

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Validate website
        run: |
          python3 scripts/assemble.py
          node --test tests/frontend.test.cjs

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - name: Wait for legacy Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq '.build_type')" = legacy ]; then
            for attempt in $(seq 1 30); do
              status=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$GITHUB_SHA&per_page=30" --jq '[.workflow_runs[] | select(.name == "pages build and deployment") | .status][0] // "missing"')
              if [ "$status" = completed ]; then break; fi
              sleep 10
            done
            if [ "$status" != completed ]; then
              echo "Legacy deployment is still active; refusing to race it."
              exit 1
            fi
          fi

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
