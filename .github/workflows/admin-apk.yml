name: Build Admin APK

on:
  push:
    branches: [main]
    paths:
      - "android-admin/**"
      - "web/admin/**"
      - "web/assets/**"
      - "scripts/**"
      - ".github/workflows/admin-apk.yml"
  pull_request:
    branches: [main]
    paths:
      - "android-admin/**"
      - "web/admin/**"
      - "web/assets/**"
      - "scripts/**"
      - ".github/workflows/admin-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Validate interfaces
        run: |
          python3 scripts/assemble.py
          node --test tests/frontend.test.cjs
      - name: Build release APK
        working-directory: android-admin
        run: gradle :app:assembleRelease

      - name: Include signing and verification tool
        run: |
          mkdir -p signing-tools
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" signing-tools/apksigner.jar

      - uses: actions/upload-artifact@v4
        with:
          name: tiraz-admin-apk
          path: |
            android-admin/app/build/outputs/apk/release/app-release-unsigned.apk
            signing-tools/apksigner.jar
